; =====================================================================
;  php/forja.ini · Directivas de TU entorno de desarrollo      [CE 2.f]
;  Se monta en /usr/local/etc/php/conf.d/zz-forja.ini
;  Tras modificarlo:  docker compose restart php
;
;  AL MENOS 6 directivas, una por línea, cada una con un
;  comentario (;) que explique QUÉ hace y POR QUÉ la configuras así.
; =====================================================================

; --- 1. Muestra errores en la salida HTML del navegador para depurarlos al instante en desarrollo
display_errors = On

; --- 2. Nivel de reporte de errores: reporta todos los niveles (avisos, advertencias, fallos críticos)
error_reporting = E_ALL

; --- 3. Zona horaria por defecto: asegura que date() use la hora peninsular española
date.timezone = Europe/Madrid

; --- 4. Desactiva la etiqueta corta "<?": buena práctica para evitar conflictos con XML y portabilidad
short_open_tag = Off

; --- 5. Oculta la cabecera HTTP "X-Powered-By: PHP/...": medida de seguridad para no exponer la versión
expose_php = Off

; --- 6. Límite de memoria por script: previene que un script con consumo excesivo agote los recursos del contenedor
memory_limit = 128M
