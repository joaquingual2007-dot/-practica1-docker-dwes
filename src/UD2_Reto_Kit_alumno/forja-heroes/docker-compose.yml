# =====================================================================
#  UD2 · Reto evaluable "Forja de Héroes"
#  Entorno: servidor web (Nginx) + intérprete PHP (PHP-FPM) en
#  contenedores SEPARADOS, igual que en producción.
#
#  Arrancar:   docker compose up -d
#  Abrir:      http://localhost:8080/ficha.php
#  Parar:      docker compose down
# =====================================================================
services:

  # --- Servidor web: recibe la petición HTTP del navegador ---------
  web:
    image: nginx:stable-alpine
    ports:
      - "8080:80"                      # puerto_del_host:puerto_del_contenedor
    volumes:
      - ./src:/var/www/html:ro         # nuestro código (solo lectura para Nginx)
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  # --- Intérprete PHP: ejecuta los .php que Nginx le pasa ---------
  php:
    image: php:8.4-fpm-alpine          # PHP 8.4
    volumes:
      - ./src:/var/www/html
      # Nuestras DIRECTIVAS personalizadas (ver UD2, CE f).
      # Todo .ini de conf.d se carga al arrancar PHP-FPM.
      - ./php/forja.ini:/usr/local/etc/php/conf.d/zz-forja.ini:ro
