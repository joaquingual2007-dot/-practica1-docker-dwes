# Configuración mínima de Nginx para pasar los .php a PHP-FPM.
server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    # Ficheros estáticos (css, imágenes...): los sirve Nginx directamente.
    location / {
        try_files $uri $uri/ =404;
    }

    # Ficheros .php: Nginx NO sabe ejecutarlos. Se los reenvía al
    # contenedor "php" por FastCGI (puerto 9000) y espera el HTML resultante.
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # La carpeta inc/ contiene código PHP de apoyo: nunca se pide desde fuera.
    location ^~ /inc/ {
        deny all;
    }
}
