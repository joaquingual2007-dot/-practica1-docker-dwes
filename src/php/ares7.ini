; =====================================================================
;  Directivas de PHP para el ENTORNO DE DESARROLLO de la UD2
;  (se montan en /usr/local/etc/php/conf.d/zz-ares7.ini)
;
;  Tras cambiar este fichero:  docker compose restart php
; =====================================================================

; --- Errores: en desarrollo queremos VERLOS todos --------------------
display_errors = On          ; mostrar errores en la página (¡en producción: Off!)
display_startup_errors = On
error_reporting = E_ALL      ; informar de TODOS los niveles de error
log_errors = On              ; además, registrarlos en el log del contenedor

; --- Zona horaria: sin esto, date() trabaja en UTC ---------------------
date.timezone = Europe/Madrid

; --- Etiquetas cortas "<?" desactivadas (recomendación oficial) -------
short_open_tag = Off

; --- Límites de ejecución ------------------------------------------------
max_execution_time = 30      ; segundos máximos por script
memory_limit = 128M          ; memoria máxima por script

; --- Seguridad básica ----------------------------------------------------
expose_php = Off             ; no anunciar la versión de PHP en las cabeceras HTTP
